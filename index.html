<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scriptorium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Frank+Ruhl+Libre:wght@400;500&family=Gentium+Plus:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='2' y='2' width='12' height='12' rx='4' fill='%23FF6B57'/%3E%3Crect x='16' y='2' width='12' height='12' rx='4' fill='%23FFB020'/%3E%3Crect x='2' y='16' width='12' height='12' rx='4' fill='%232BB673'/%3E%3Crect x='16' y='16' width='12' height='12' rx='4' fill='%234C7DFF'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css">
</head>
<body class="theme-light layout-A">
<header id="top">
  <button id="drawerBtn" class="icon only-m" aria-label="Книги">☰</button>
  <div class="brand"><svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="4" fill="#FF6B57"/><rect x="16" y="2" width="12" height="12" rx="4" fill="#FFB020"/><rect x="2" y="16" width="12" height="12" rx="4" fill="#2BB673"/><rect x="16" y="16" width="12" height="12" rx="4" fill="#4C7DFF"/></svg><span class="name">Scriptorium</span></div>
  <button id="bookBtn" class="pill"><span id="bookLabel">Бытие 1</span><i>▾</i></button>
  <div class="stepper"><button id="prev" title="Предыдущая глава" aria-label="Предыдущая глава">‹</button><button id="next" title="Следующая глава" aria-label="Следующая глава">›</button></div>
  <form id="jump" autocomplete="off"><input id="jumpInp" placeholder="Перейти: Ин 3:16" aria-label="Перейти к месту"></form>
  <div class="spacer"></div>
  <div class="seg only-d" id="layoutSw" role="tablist" aria-label="Раскладка">
    <button data-l="A" title="Книга: перевод и оригинал рядом">Книга</button>
    <button data-l="B" title="Стол: колонки текстов рядом">Стол</button>
    <button data-l="D" title="Манускрипт: текст с полями">Манускрипт</button>
  </div>
  <button id="textsBtn" class="pill only-d">Тексты<i>▾</i></button>
  <button id="themeBtn" class="icon only-d" title="Тема" aria-label="Тема">◐</button>
  <button id="accBtn" class="icon only-d" title="Войти" aria-label="Личный кабинет">☺</button>
  <button id="dataBtn" class="icon only-d" title="Заметки: экспорт и импорт" aria-label="Заметки">⇅</button>
  <button id="moreBtn" class="icon only-m" aria-label="Ещё">⋯</button>
</header>
<div id="body">
  <aside id="side" aria-label="Книги"></aside>
  <main id="stage"><div id="reader"></div></main>
  <aside id="inspector"><button id="inspClose" class="icon" aria-label="Закрыть">✕</button><div id="inspBody"></div></aside>
</div>
<nav id="tbar" class="only-m" aria-label="Тексты"></nav>
<div id="scrim"></div>
<div id="pop" hidden></div>
<div id="menu" hidden></div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="decoders.js"></script>
<script src="speech.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
